name: Update publication data

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check out the publications index
        uses: actions/checkout@v4
        with:
          repository: oesteban/publications_index
          ref: main
          token: ${{ secrets.PUBLICATIONS_PAT }}
          path: pubindex

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Update data files
        run: |
          python scripts/update_publications.py pubindex/data/publications.yml _data

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain _data/pub_journal.yml _data/pub_conference.yml _data/pub_other.yml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: update publications data"
            git push
          else
            echo "No changes to commit"
          fi
