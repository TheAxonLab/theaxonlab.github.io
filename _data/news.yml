- date: Oct 15, 2026
  headline: |
    Our preprint <a href="https://osf.io/preprints/psyarxiv/cn59h_v2"><i>Registered Reports as the default pathway for confirmatory publication</i></a> is out!
  body: |
    After a long collaborative effort led by Dr. Marta Topor and Oscar with 88 authors, the preprint is now available on [PsyArXiv](https://osf.io/preprints/psyarxiv/cn59h_v2).
    It argues that traditional publishing rewards speed, volume and tidy positive narratives, which blurs the line between exploration and confirmation,
    and that Registered Reports should become the default pathway for publishing confirmatory research.

- date: Oct 2, 2026
  headline: |
    The <a href="https://www.indos-costaction.eu/training">INDoS Working Group 3 Training School</a> in Madrid and online, 30 September to 2 October 2026
  body: |
    Oscar co-organized with Guiomar Niso the Training School of Working Group 3 of the COST Action INDoS,
    a three-day hybrid event hosted at CSIC (c/ Serrano 113, Madrid).
    In total, 98 people attended: 30 in person in Madrid and 68 online.
    Oscar and Mélanie Garcia were among the trainers, with Yasser Alemán-Gómez, Lea Waller, Steffen Bollmann and Martin Nørgaard,
    and the programme covered standardized preprocessing, BIDS across modalities, PET, EEG/MEG, and fMRI preprocessing with fMRIPrep.
    The [training materials](https://www.indos-costaction.eu/wg3-ts2026) are openly available under CC BY 4.0.

- date: Sep 2026
  headline: |
    Congratulations to Philip Nkwam on <a href="https://webmriqc.mailab.io/">WebMRIQC</a>, accepted at the MICCAI 2026 MIRASOL Workshop!
  body: |
    *WebMRIQC: A Web-Based Implementation of MRIQC for Accessible MRI Image Quality Assessment in Resource-Constrained Settings*,
    by Philip Nkwam with Udunna Anazodo, Maruf Adewole, Sekinat Zurakat-Aderibigbe and colleagues at the Medical Artificial Intelligence Laboratory (MAI Lab) and CAMERA MRI Africa,
    has been accepted at the MIRASOL Workshop of MICCAI 2026 in France.
    WebMRIQC is a free, zero-installation platform that runs the full, unmodified MRIQC pipeline from the browser:
    users upload a DICOM or BIDS folder, and it converts DICOM to BIDS, runs MRIQC on shared compute,
    and returns an interactive quality dashboard with normative benchmarks.
    Validated against native MRIQC on the BraTS-Africa and BraTS 2021 datasets, it showed near-perfect agreement across all image quality metrics.
    It lowers the barriers that keep many imaging centres in Africa and other low- and middle-income settings out of standardized MRI quality control.
    Try it at [webmriqc.mailab.io](https://webmriqc.mailab.io/) and find the code on [GitHub](https://github.com/CAMERA-MRI/WebMRIqc).
    Thank you, Philip and team, for the kind acknowledgment of Oscar and MRIQC!

- date: Sep 2026
  headline: |
    New papers in 2026: eye MRI, eye-tracking data standards, PET preprocessing and diffusion MRI
  body: |
    - **Eye MRI.** *A-eye: Automated 3D MRI segmentation and morphometric feature extraction for eye and orbit atlas construction* (Barranco et al.) appeared in *PLoS One* (Jul 2026; doi:[10.1371/journal.pone.0352257](https://doi.org/10.1371/journal.pone.0352257)).
    - **Data standards.** *Eye-Tracking-BIDS: the Brain Imaging Data Structure extended to gaze position and pupil data* (Szinte et al.) was posted on bioRxiv (Feb 2026; doi:[10.64898/2026.02.03.703514](https://doi.org/10.64898/2026.02.03.703514)).
    - **PET preprocessing.** *PETPrep: a robust preprocessing pipeline for positron emission tomography (PET) neuroimaging* (Nørgaard et al.) was presented as an oral at NRM2026 (Uppsala, Sweden).
    - **Diffusion MRI.** The chapter *Diffusion Weighted Imaging: Principles and Applications* (Fischi-Gómez et al.) appeared in *Research Methods for Biological Psychology* (Sep 2026; doi:[10.1007/978-1-0716-5340-1_11](https://doi.org/10.1007/978-1-0716-5340-1_11)).

- date: Aug 2026
  headline: |
    Pilot launch of the <a href="https://www.indos-costaction.eu/journal-club/">INDoS Federated Journal Club</a>
  body: |
    The Federated Journal Club is a trainee-oriented activity of Working Group 3 of the COST Action INDoS,
    in which participants collaboratively read and critically annotate the neuroimaging-preprocessing literature
    across nine imaging modalities plus a cross-modality methods category.
    It is open to everyone, with no INDoS membership required, and especially welcomes trainees and early-career researchers.
    For the pilot, Oscar deployed a pipeline that coordinates the club entirely on GitHub (Issues, Actions and Pages):
    participants claim up to three papers by opening an issue, a bot sets the 12-day deadlines and sends reminders,
    the annotated reviews are graded against a five-axis rubric, and a live leaderboard shows the progress.
    [Join the Journal Club](https://www.indos-costaction.eu/journal-club/participate.html)!

