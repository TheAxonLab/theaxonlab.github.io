- date: May 2025
  headline: |
    New papers in the first half of 2025: reproducibility, fetal and clinical MRI, eye imaging and eye tracking
  body: |
    - **Reproducibility.** Oscar's chapter *Standardized Preprocessing in Neuroimaging: Enhancing Reliability and Reproducibility* appeared in *Methods for Analyzing Large Neuroimaging Datasets* (Neuromethods 218; online Dec 2024; doi:[10.1007/978-1-0716-4260-3_8](https://doi.org/10.1007/978-1-0716-4260-3_8)),
      and *A numerical variability approach to results stability tests and its application to neuroimaging* (Chatelain et al.) appeared in *IEEE Transactions on Computers* (Jan 2025; doi:[10.1109/TC.2024.3475586](https://doi.org/10.1109/TC.2024.3475586)).
    - **Fetal MRI.** *A dataset of synthetic, maturation-informed magnetic resonance images of the human fetal brain* (Lajous et al.) appeared in *Scientific Data* (Apr 2025; doi:[10.1038/s41597-025-04926-9](https://doi.org/10.1038/s41597-025-04926-9)),
      following *FetMRQC: A robust quality control system for multi-centric fetal brain MRI* (Sanchez et al.) in *Medical Image Analysis* (Oct 2024; doi:[10.1016/j.media.2024.103282](https://doi.org/10.1016/j.media.2024.103282)).
    - **Clinical AI.** *Assessing workflow impact and clinical utility of AI-assisted brain aneurysm detection: a multi-reader study* (Di Noto et al.) appeared in *NeuroImage: Clinical* (doi:[10.1016/j.nicl.2025.103835](https://doi.org/10.1016/j.nicl.2025.103835)).
    - **Eye imaging and eye tracking.** At ISMRM 2025 (Honolulu), the oral *MR-Eye: A High-Resolution Motion-Resolved MRI Protocol for Anatomical Imaging of the Human Eye* (Jia et al.)
      and the poster *MR-Eye atlas: a large-scale atlas of the eye based on T1-weighted MR imaging* (Barranco et al.);
      at VSS 2025, the poster *Eye-Tracking-BIDS: the brain imaging data structure extended to gaze position and pupil data* (Szinte et al.; doi:[10.1167/jov.25.9.2351](https://doi.org/10.1167/jov.25.9.2351)).

- date: Apr 30, 2025
  headline: |
    Céline's registered report on defacing biases is out in <i>PLOS Biology</i>!
  body: |
    *Removing facial features from structural MRI images biases visual quality assessment* (doi:[10.1371/journal.pbio.3003149](https://doi.org/10.1371/journal.pbio.3003149))
    completes the registered report that received [Stage 1 in principle acceptance](https://rr.peercommunityin.org/articles/rec?id=346) from PCI RR in May 2023.
    Defacing structural MRI for privacy biases human visual quality assessment, while MRIQC's automated quality metrics are largely unaffected.

- date: Mar 6, 2025
  headline: |
    Céline is now Dr. Provins! Congratulations!
  body: |
    Céline defended her thesis *Characterizing and Improving the Reliability of Brain Connectivity extracted with Magnetic Resonance Imaging*
    at the University of Lausanne ([thesis](https://iris.unil.ch/handle/iris/252793)).
    She will stay with the lab as a post-doctoral research software engineer.

- date: Jan 14, 2025
  headline: |
    Céline successfully passed her private defense! Congratulations!
  body: |
    Céline has successfully completed her private thesis defense.
    In Switzerland, the private defense is a critical prelude to the finalization of Ph.D. programs with the *public defense*.
    Her public defense will take place in March 6, 2025.
    The committee praised her rigorous methodology, and the clarity and substantial contributions to the field of her thesis manuscript.
    This achievement is a testament to her hard work and dedication over the past 4 years.
    Congratulations, Céline!  
